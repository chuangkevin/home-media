name: Deploy to Server via Tailscale

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:  # 允許手動觸發

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  deploy:
    concurrency:
      group: home-media-deploy
      cancel-in-progress: false
    # A successful shell step does not skip the remaining steps. Gate the entire job.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Test Tailscale Connection
        run: |
          echo "Testing connection to deployment server..."
          tailscale status
          ping -c 3 ${{ secrets.DEPLOY_SERVER_IP }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Stage video-cache deployment files
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stage_name=".video-cache-deploy-${run_key}"
          remote_stage="${DEPLOY_PATH}/${stage_name}"
          remote_stage_b64=$(printf '%s' "$remote_stage" | base64 | tr -d '\n')
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_SERVER_IP" "bash -s -- '$remote_stage_b64'" <<'REMOTE'
          set -euo pipefail
          remote_stage=$(printf '%s' "$1" | base64 -d)
          remote_parent=${remote_stage%/*}
          remote_name=${remote_stage##*/}
          cd -- "$remote_parent"
          [[ ! -e "$remote_name" && ! -L "$remote_name" ]] || exit 1
          mkdir -- "$remote_name"
          [[ -d "$remote_name" && ! -L "$remote_name" ]] || exit 1
          REMOTE
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.video-cache.yml scripts/persist-video-cache.sh \
            "$DEPLOY_USER@$DEPLOY_SERVER_IP:$remote_stage/"
          deploy_path_b64=$(printf '%s' "$DEPLOY_PATH" | base64 | tr -d '\n')
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_SERVER_IP" "bash -s -- '$stage_name' '$run_key' '$deploy_path_b64'" <<'REMOTE'
          set -euo pipefail
          stage_name=$1
          run_key=$2
          deploy_path=$(printf '%s' "$3" | base64 -d)
          cd -- "$deploy_path"
          stage_dir="$deploy_path/$stage_name"
          [[ -d "$stage_dir" && ! -L "$stage_dir" ]] || exit 1
          [[ -f "$stage_dir/docker-compose.video-cache.yml" && ! -L "$stage_dir/docker-compose.video-cache.yml" ]] || exit 1
          [[ -f "$stage_dir/persist-video-cache.sh" && ! -L "$stage_dir/persist-video-cache.sh" ]] || exit 1
          if [[ -e scripts || -L scripts ]]; then
            [[ -d scripts && ! -L scripts ]] || exit 1
          else
            mkdir -- scripts
          fi

          # Back up only the two deployment-owned files; never replace the host's base compose file.
          for file in docker-compose.video-cache.yml scripts/persist-video-cache.sh; do
            target="$deploy_path/$file"
            if [[ -e "$target" || -L "$target" ]]; then
              [[ -f "$target" && ! -L "$target" ]] || exit 1
              cp -p -- "$target" "$target.bak.$run_key"
            fi
          done

          mv -- "$stage_dir/docker-compose.video-cache.yml" \
            "$deploy_path/docker-compose.video-cache.yml"
          mv -- "$stage_dir/persist-video-cache.sh" \
            "$deploy_path/scripts/persist-video-cache.sh"
          chmod 755 -- "$deploy_path/scripts/persist-video-cache.sh"
          rmdir -- "$deploy_path/$stage_name"
          REMOTE

      - name: Deploy via SSH
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          deploy_path_b64=$(printf '%s' "$DEPLOY_PATH" | base64 | tr -d '\n')
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_SERVER_IP" "bash -s -- '$deploy_path_b64'" <<'REMOTE'
            set -euo pipefail
            deploy_path=$(printf '%s' "$1" | base64 -d)
            cd -- "$deploy_path"

            # 重試函數：最多重試 3 次，每次間隔遞增
            compose() {
              docker compose -f docker-compose.yml -f docker-compose.video-cache.yml "$@"
            }

            retry_pull() {
              local max_attempts=3
              local attempt=1
              local delay=10

              while [ $attempt -le $max_attempts ]; do
                echo "🔄 Pulling Docker images (attempt $attempt/$max_attempts)..."
                if compose pull backend frontend; then
                  echo "✅ Pull successful!"
                  return 0
                fi

                if [ $attempt -lt $max_attempts ]; then
                  echo "⚠️ Pull failed, retrying in ${delay}s..."
                  sleep $delay
                  delay=$((delay * 2))
                fi
                attempt=$((attempt + 1))
              done

              echo "❌ Pull failed after $max_attempts attempts"
              return 1
            }

            compose config -q
            video_cache_manifest=$(mktemp "${TMPDIR:-/tmp}/home-media-video-cache.XXXXXX")
            trap 'rm -f -- "$video_cache_manifest"' EXIT

            # First pass preserves completed files visible before image pull.
            bash scripts/persist-video-cache.sh prepare "$video_cache_manifest"

            retry_pull

            # Refresh immediately before stopping the old backend; this catches
            # downloads that finished during the image pull without copying temp files.
            # A cache that finishes after this scan can be fetched again after restart.
            bash scripts/persist-video-cache.sh prepare "$video_cache_manifest"

            echo "🛑 Stopping existing containers..."
            docker stop --time 30 home-media-backend home-media-frontend 2>/dev/null || true
            docker rm -f home-media-backend home-media-frontend 2>/dev/null || true

            echo "🚀 Starting updated containers..."
            compose up -d --force-recreate --no-deps backend frontend

            bash scripts/persist-video-cache.sh verify "$video_cache_manifest"

            echo "✅ Deployment completed successfully!"
            compose ps backend frontend
          REMOTE

      - name: Health Check
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "🏥 Performing health check via SSH..."

          # 用 docker exec 在 container 內部做 health check（port 3001 沒暴露到 host）
          for i in $(seq 1 24); do
            echo "  Attempt $i/24..."
            if ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_SERVER_IP} \
              'docker exec home-media-backend node -e "require(\"http\").get(\"http://localhost:3001/health\",(r)=>{process.exit(r.statusCode===200?0:1)}).on(\"error\",()=>process.exit(1))"' 2>/dev/null; then
              echo "✅ Health check passed!"
              exit 0
            fi
            sleep 5
          done

          # 失敗時輸出 container 狀態方便 debug
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_SERVER_IP} \
            'docker compose ps; docker logs home-media-backend --tail 30' || true

          echo "❌ Health check failed after 120 seconds"
          exit 1

      - name: Bounded private HTTP diagnostics (not an audibility test)
        timeout-minutes: 2
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # Reuse established SSH/known_hosts; no new login, port, ACL, or credential.
          # Remote stderr is suppressed to avoid leaking paths or connection details.
          if ! timeout --signal=TERM 30s ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_SERVER_IP" \
            'docker exec -i home-media-backend node -' \
            < scripts/post-deploy-diagnostic.cjs 2>/dev/null; then
            echo '{"stage":"diagnostic","category":"transport_or_probe_failed_no_retry"}'
          fi

      - name: Tailnet HTTPS hostname diagnostics (not an audibility test)
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # Existing Tailscale connection is already established in this deploy job.
          if ! timeout --signal=TERM 35s node scripts/diagnose-ingress.cjs tailnet; then
            echo '{"vantage":"github_runner_tailnet_hostname","stage":"diagnostic","category":"probe_failed_no_retry"}'
          fi

      - name: Tailnet WebSocket upgrade diagnostic (not a session or audio test)
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # One strict-TLS handshake through the already established Tailnet.
          if ! timeout --signal=TERM 25s node scripts/probe-websocket-upgrade.cjs; then
            echo '{"vantage":"github_runner_tailnet_hostname","stage":"websocket_upgrade","category":"probe_failed_no_retry"}'
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: \`${{ secrets.DEPLOY_SERVER_IP }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Images**:" >> $GITHUB_STEP_SUMMARY
          echo "  - Frontend: \`${{ env.DOCKERHUB_USERNAME }}/home-media-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Backend: \`${{ env.DOCKERHUB_USERNAME }}/home-media-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Please check the logs above." >> $GITHUB_STEP_SUMMARY

